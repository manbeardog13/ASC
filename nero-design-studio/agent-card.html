    <!-- ASC AGENT — a calm AI window UNDER the stage (col 1), matching its width.
         Resting: just the rotating hook. On hover the chat bubble blur-fades in,
         then the three suggestion chips fade-rise one by one. Notch = real mask cut. -->
    <div class="agent-shell reveal" id="agentShell" style="animation-delay:230ms">
      <span class="notch-tab" id="agentTab">Nero</span>
      <section class="agent-card" id="agentCard" role="group" aria-label="Nero">
        <div class="agent-body">
          <span class="agent-hook l1" id="agentHook">…</span>
          <span class="agent-hook l2" id="agentHook2" aria-hidden="true">…</span>
          <span class="agent-hook l3" id="agentHook3" aria-hidden="true">…</span>
          <div class="agent-reveal">
            <div class="text-bubble">
              <input class="tb-input" id="tbInput" type="text" autocomplete="off" placeholder="Pitaj Nero…" aria-label="Pitaj Nero">
              <button class="tb-send" type="button" aria-label="Pošalji"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></button>
            </div>
            <div class="chips" role="list">
              <button class="qchip" type="button" role="listitem" style="--ci:0" data-q="Nađi gume za DU 123-AB">nađi set</button>
              <button class="qchip" type="button" role="listitem" style="--ci:1" data-q="Koliko je slobodno u skladištu?">koliko je slobodno</button>
              <button class="qchip" type="button" role="listitem" style="--ci:2" data-q="Tko čeka na preuzimanje danas?">tko čeka</button>
              <button class="qchip" type="button" role="listitem" style="--ci:3" data-q="Nađi gume po registraciji">gume po tablici</button>
              <button class="qchip" type="button" role="listitem" style="--ci:4" data-q="Koji su podsjetnici za danas?">podsjetnici danas</button>
              <button class="qchip" type="button" role="listitem" style="--ci:5" data-q="Koje police su slobodne?">slobodne police</button>
              <button class="qchip" type="button" role="listitem" style="--ci:6" data-q="Koji je zadnji zaprimljeni set?">zadnji unos</button>
              <button class="qchip" type="button" role="listitem" style="--ci:7" data-q="Napravi izvještaj smjene">izvještaj smjene</button>
              <button class="qchip" type="button" role="listitem" style="--ci:8" data-q="Spremi SMS za preuzimanje">spremi SMS</button>
            </div>
          </div>
        </div>
      </section>
    </div>
