<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASC — Ploča</title>
<meta name="theme-color" content="#020305">
<link rel="icon" href="app/assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app/assets/apple-touch-icon.png">
<!-- DELIVERY BUILD (2026-07-09): the root opens the real app under app/ — the
     Prag splash covers the hop, the auth gate lands unauthenticated visitors on
     the login card. Client-side replace() keeps the service worker's
     network-first navigation happy (no HTTP redirect for it to refuse to
     cache); the meta refresh + the visible link are no-JS fallbacks. -->
<script>
// Path-aware: when an offline service worker answers a deep /app/ navigation
// with this page, a bare relative redirect would resolve to app/app/… and loop.
// The timestamp guard is a hard stop: if we land back here within 3s of already
// redirecting (a precache hole bouncing us), we give up and show the manual
// button below instead of spinning forever.
(function(){
  var now = Date.now(), KEY = 'asc.redir.ts';
  try {
    if (now - (+sessionStorage.getItem(KEY) || 0) < 3000) return;
    sessionStorage.setItem(KEY, String(now));
  } catch(e){}
  var p = location.pathname;
  var base = p.indexOf('/app/') >= 0 ? p.slice(0, p.indexOf('/app/') + 1) : p.replace(/[^\/]*$/, '');
  location.replace(base + 'app/dashboard.html');
})();
</script>
<style>
  html,body{min-height:100%;margin:0}
  body{min-height:100vh;min-height:100dvh;background:#020305;color:#f4f5f7;font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
  .b{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;max-width:340px;padding:24px}
  .m{font-weight:800;font-size:26px;letter-spacing:2px;color:#ff4e1b;margin-bottom:14px}
  p{color:#9aa0ac;font-size:14px;line-height:1.5;margin:0 0 20px}
  a{display:inline-block;min-height:46px;line-height:46px;padding:0 22px;border-radius:999px;
    background:#ff4e1b;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
  .nero-mark{position:static;z-index:auto;flex:none;width:100%;margin-top:auto;padding:16px 16px 12px;text-align:center;
    font-family:"Sora","Inter",system-ui,sans-serif;font-weight:400;font-size:.78rem;line-height:1.45;letter-spacing:.08em;text-transform:lowercase;
    color:rgba(244,245,247,.6);pointer-events:none}
  .nero-mark a{display:inline;min-height:0;line-height:1.45;padding:0;border-radius:0;background:none;
    color:rgba(244,245,247,.92);opacity:.6;font:inherit;letter-spacing:inherit;font-weight:400;
    text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:3px;text-decoration-color:transparent;
    pointer-events:auto;transition:color 180ms ease,opacity 180ms ease,text-decoration-color 180ms ease}
  .nero-mark a:hover,.nero-mark a:focus-visible{opacity:.85;color:#ff4e1b;text-decoration-color:currentColor}
  .nero-mark a:focus-visible{outline:1px solid #ff4e1b;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.nero-mark a{transition:none}}
</style>
</head>
<body>
  <div class="b">
    <div class="m">ASC</div>
    <p>Otvaram ploču…</p>
    <a href="app/dashboard.html">Otvori ploču →</a>
  </div>
<p class="nero-mark">powered by <a href="https://nerosummit.com">nerosummit.com</a></p>
</body>
</html>
