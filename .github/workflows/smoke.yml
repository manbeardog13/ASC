name: smoke

# Throwaway Postgres loads schema.sql and every migration, then a headless
# browser loads the main pages. No production Supabase access and no secrets.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Apply schema and migrations, then load pages
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bash scripts/smoke.sh
