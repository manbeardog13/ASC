name: smoke

# Throwaway Postgres loads schema.sql and every migration, then a headless
# browser loads the main pages. No production Supabase access and no secrets.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Postgres and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
          sudo apt-get install -y chromium-browser || sudo apt-get install -y chromium || true
          if ! command -v chromium && ! command -v google-chrome && ! command -v chromium-browser; then
            sudo apt-get install -y wget gnupg
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
          fi
      - name: Apply schema and migrations, then load pages
        run: bash scripts/smoke.sh
