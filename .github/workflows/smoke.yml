name: smoke

# Throwaway Postgres loads schema.sql and every migration, then a headless
# browser loads the main pages. No production Supabase access and no secrets.
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql postgresql-client
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Apply schema and migrations, then load pages
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: bash scripts/smoke.sh
      - name: Browser interaction and cancellation regressions
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          npm install --prefix "$RUNNER_TEMP/asc-browser-tests" --no-save --package-lock=false playwright@1.62.1
          export NODE_PATH="$RUNNER_TEMP/asc-browser-tests/node_modules"
          node tests/composer.browser.cjs
          node tests/platform.browser.cjs
          node tests/placement.browser.cjs
          node tests/warehouse-integrity.browser.cjs
          node tests/composer-history.browser.cjs
          node tests/composer-async.browser.cjs
          node tests/dashboard-agent.browser.cjs
          node tests/label-print.browser.cjs
          node tests/detail-overlay.browser.cjs
      - name: Warehouse areas, shared layouts and recovery regression
        env:
          CHROMIUM_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          export NODE_PATH="$RUNNER_TEMP/asc-browser-tests/node_modules"
          node tests/warehouse-areas.browser.cjs
          node tests/warehouse.browser.cjs
      - name: Retain synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-browser-evidence
          path: out/assistant-tests/
          if-no-files-found: ignore
          retention-days: 7
