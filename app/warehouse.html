<html lang="hr">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
  html,body{min-height:100%;margin:0}
  body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:"Sora","Inter",system-ui,sans-serif;background:#f4f5f7;color:#1c1e24}
  body>a{flex:1;display:flex;align-items:center}
  .nero-mark{position:static;flex:none;width:100%;margin-top:auto;padding:16px 16px 12px;text-align:center;
    font-weight:400;font-size:.78rem;line-height:1.45;letter-spacing:.08em;text-transform:lowercase;
    color:rgba(46,42,38,.6);pointer-events:none}
  .nero-mark a{color:#2e2f31;opacity:.6;text-decoration-line:underline;text-decoration-thickness:1px;text-underline-offset:3px;
    text-decoration-color:transparent;pointer-events:auto;transition:color 180ms ease,opacity 180ms ease,text-decoration-color 180ms ease}
  .nero-mark a:hover,.nero-mark a:focus-visible{opacity:.85;color:#ff4e1b;text-decoration-color:currentColor}
  .nero-mark a:focus-visible{outline:1px solid #ff4e1b;outline-offset:3px}
  @media(prefers-reduced-motion:reduce){.nero-mark a{transition:none}}
</style></head>
