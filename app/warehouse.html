<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASC — Skladište</title>
<meta name="theme-color" content="#edf0f5">
<script>try{if(localStorage.getItem('asc.theme')==='dark'){document.documentElement.classList.add('dark');document.querySelector('meta[name="theme-color"]').content='#0a0c11';}}catch(e){}try{if(sessionStorage.getItem('asc.splash.warm')==='1'&&document.referrer&&new URL(document.referrer).origin===location.origin){document.documentElement.classList.add('warm-nav');}}catch(e){}</script>
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  ASC warehouse — CLEAN-ROOM REBUILD (isolated preview).
  Shared design system lives in app.css + app.js (v6 "Hanssen"): tokens, glass
  shell, header, notched corner tabs, card surfaces, chips, iOS dock, theme
  toggle + count-up animations — all LINKED, never redefined. Only the
  warehouse-map layout (occupancy header, zone → rack → shelf → slot grid) is
  page-specific and lives inline below. No green/red imagery here — those belong
  to check-in / pickup only. LIVE: the map, pills and numbers are built by
  live-warehouse.js from real Supabase data (warehouseOccupancy + listStorageSets);
  the HTML below is the empty skeleton it fills.
-->
<link rel="stylesheet" href="app.css">
<style>
/* ---- Warehouse-page-specific layout only (shared rules live in app.css) ---- */

/* Occupancy overview = the hero: a .card.dark that states the count + spread */
.wh-head{gap:0}
.wh-head .eyebrow{font:600 10.5px Inter;letter-spacing:.09em;text-transform:uppercase;color:var(--on-stage-2)}
.wh-title{display:flex;align-items:baseline;gap:12px;margin:8px 0 2px;flex-wrap:wrap}
.wh-title h1{font-family:Sora;font-weight:600;font-size:clamp(28px,7vw,40px);letter-spacing:-.02em;line-height:1}
.wh-title .sub{font:500 12.5px Inter;color:var(--on-stage-2)}
.wh-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.wh-stat{background:rgba(244,245,247,.08);border:0;border-top:1px solid rgba(255,255,255,.09);border-radius:14px;padding:12px 12px 11px}
.wh-stat b{display:block;font-family:Sora;font-weight:500;font-size:clamp(22px,5.4vw,27px);line-height:1;letter-spacing:-.01em}
.wh-stat span{font:600 10px Inter;letter-spacing:.05em;text-transform:uppercase;color:var(--on-stage-2);display:block;margin-top:5px}
.wh-stat.res b{color:var(--lava-2)}
.wh-meter{margin-top:15px;height:8px;border-radius:4px;background:rgba(244,245,247,.14);overflow:hidden}
.wh-meter i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--lava-2),var(--lava));transition:width 1100ms var(--smooth)}
.wh-cap{margin-top:9px;font:500 11.5px Inter;color:var(--on-stage-2)}
.wh-legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(244,245,247,.10)}
.leg{display:flex;align-items:center;gap:7px;font:600 11px Inter;color:var(--on-stage-2)}
.leg i{width:13px;height:13px;border-radius:5px;flex:none}
.leg.f i{background:var(--lava)}
.leg.r i{background:var(--lava-tint);box-shadow:inset 0 0 0 1.5px var(--lava-ring)}
.leg.e i{background:rgba(244,245,247,.10);box-shadow:inset 0 0 0 1.5px rgba(244,245,247,.22)}

/* Zone quick-nav pills (reuses .chip; scroll-jump to a zone) */
.wh-zonebar{display:flex;flex-wrap:wrap;gap:8px;margin:var(--gap) 4px 2px}
.wh-zonepill{margin-top:0;cursor:pointer;gap:7px;padding:6px 7px 6px 11px;background:var(--panel);color:var(--ink-2);border:1px solid var(--line);transition:transform 150ms var(--snap),background 150ms var(--snap),color 150ms var(--snap)}
.wh-zonepill .n{font:800 10px Inter;min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--lava-tint);color:var(--lava-ink);display:inline-flex;align-items:center;justify-content:center}
@media(any-hover:hover){ .wh-zonepill:hover{transform:translateY(-1px);background:var(--panel-2);color:var(--ink)} }
.wh-zonepill:active{transform:scale(.96);transition-duration:80ms}

/* Zone = a .card holding a native <details>; summary is the zone header */
.wh-zone{margin-top:var(--gap);padding-top:32px}
.wh-zone>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;user-select:none}
.wh-zone>summary::-webkit-details-marker{display:none}
.wh-badge{width:34px;height:34px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;
  background:radial-gradient(circle at 32% 28%,var(--lava-2),var(--lava) 64%,#d6390c);box-shadow:0 6px 16px rgba(255,78,27,.32)}
.wh-name{font-family:Sora;font-weight:600;font-size:16px;letter-spacing:-.01em;line-height:1.1}
.wh-name small{display:block;font:500 11.5px Inter;color:var(--muted);letter-spacing:0;margin-top:2px}
.wh-fill{margin-left:auto;font:600 12px Inter;color:var(--muted);white-space:nowrap}
.wh-fill b{color:var(--ink);font-weight:700}
.wh-chev{flex:none;color:var(--muted);display:grid;place-items:center;transition:transform 260ms var(--snap)}
.wh-zone[open]>summary .wh-chev{transform:rotate(180deg)}
.wh-zone-body{margin-top:16px;display:flex;flex-direction:column;gap:14px}

/* Rack → shelf → slots */
.wh-rack{border:1px solid var(--hairline);border-radius:16px;background:var(--panel-2);padding:12px 13px 13px}
html.dark .wh-rack{background:rgba(244,245,247,.03)}
.wh-rack-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:11px}
.wh-rack-head .r{font:700 12.5px Inter;letter-spacing:.02em}
.rfill{font:600 11px Inter;color:var(--muted)}
.rfill b{color:var(--lava-ink);font-weight:800}
html.dark .rfill b{color:var(--lava-2)}
.wh-shelf{display:grid;grid-template-columns:64px 1fr;gap:11px;align-items:start;padding:9px 0;border-top:1px dashed var(--line)}
.wh-shelf:first-of-type{border-top:0;padding-top:2px}
.wh-shelf-lab{font:600 10.5px Inter;letter-spacing:.03em;color:var(--muted);padding-top:9px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.slot{aspect-ratio:1/1;border-radius:11px;display:grid;place-items:center;font:700 12px Inter;text-decoration:none;position:relative;
  transition:transform 140ms var(--snap),box-shadow 200ms var(--snap),background 150ms var(--snap)}
.slot.filled{background:var(--lava);color:#fff;box-shadow:0 5px 13px -6px var(--lava)}
.slot.reserved{background:var(--lava-tint);color:var(--lava-ink);box-shadow:inset 0 0 0 1.5px var(--lava-ring)}
html.dark .slot.reserved{color:var(--lava-2)}
.slot.empty{background:var(--panel);color:var(--muted);box-shadow:inset 0 0 0 1.5px var(--line);font-weight:600;pointer-events:none}
html.dark .slot.empty{background:rgba(244,245,247,.04)}
@media(any-hover:hover){ .slot.filled:hover,.slot.reserved:hover{transform:translateY(-2px);box-shadow:0 10px 20px -8px var(--lava-ring)} }
.slot.filled:active,.slot.reserved:active{transform:scale(.92);transition-duration:80ms}
.slot .rdot{position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:var(--lava)}

@media(max-width:460px){ .wh-shelf{grid-template-columns:1fr;gap:6px} .wh-shelf-lab{padding-top:0} }

/* Slot window — click a lot → a small window with the customer's name + brief
   details; click the lot again to close it; click the WINDOW → "Uredi": the set
   opens pre-filled in check-in (sessionStorage 'asc.prefill'). Deliberately
   colourless: pure white, black/grey text, rounded, soft shadow — max
   legibility, no lava. Same in light + dark. */
.slot.slot-active{transform:scale(.9);box-shadow:0 0 0 3px rgba(2,3,5,.42);z-index:3}
.wh-win{position:fixed;z-index:85;width:max-content;max-width:min(280px,90vw);cursor:pointer;
  padding:13px 16px 12px;border-radius:16px;background:#fff;color:#111;
  border:1px solid rgba(0,0,0,.08);
  box-shadow:0 20px 48px -16px rgba(0,0,0,.42),0 4px 12px -6px rgba(0,0,0,.18);
  -webkit-user-select:none;user-select:none;
  opacity:0;transform:translateY(7px) scale(.97);transform-origin:bottom center;
  transition:opacity .2s var(--smooth),transform .26s cubic-bezier(.16,1,.3,1),box-shadow .2s var(--smooth)}
.wh-win.show{opacity:1;transform:none}
.wh-win.below{transform-origin:top center}
.wh-win::after{content:"";position:absolute;left:var(--caret,50%);bottom:-6px;width:12px;height:12px;
  background:#fff;border-right:1px solid rgba(0,0,0,.08);border-bottom:1px solid rgba(0,0,0,.08);
  transform:translateX(-50%) rotate(45deg)}
.wh-win.below::after{bottom:auto;top:-6px;border:0;border-left:1px solid rgba(0,0,0,.08);border-top:1px solid rgba(0,0,0,.08)}
@media(any-hover:hover){ .wh-win:hover{transform:translateY(-1px);box-shadow:0 24px 54px -14px rgba(0,0,0,.48)} }
.wh-win:active{transform:scale(.99)}
.wh-win-name{font:700 15.5px Sora;letter-spacing:-.01em;color:#0a0a0a}
.wh-win-sub{font:600 12.5px Inter;color:#555;margin-top:3px}
.wh-win-loc{font:500 11.5px Inter;color:#8a8a8a;margin-top:4px;line-height:1.35}
.wh-win-go{display:flex;align-items:center;gap:5px;font:700 9.5px Inter;letter-spacing:.05em;text-transform:uppercase;color:#a0a0a0;margin-top:9px;padding-top:8px;border-top:1px solid rgba(0,0,0,.07)}
.wh-win-go svg{width:12px;height:12px}
@media(prefers-reduced-motion:reduce){ .wh-win{transition:opacity .15s linear} .slot.slot-active{transition:none} }

/* Empty state — the map's quiet card while nothing is stored yet */
.wh-empty{margin-top:var(--gap);display:flex;flex-direction:column;align-items:center;text-align:center;padding:46px 22px 42px}
.wh-empty h2{font:600 20px Sora;letter-spacing:-.01em}
.wh-empty p{font:500 12.5px Inter;color:var(--muted);margin-top:6px}
.wh-empty a{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:12px 20px;border-radius:999px;
  background:var(--lava);color:#fff;font:600 13px Inter;text-decoration:none;box-shadow:0 10px 22px -10px var(--lava);
  transition:transform 150ms var(--snap),box-shadow 200ms var(--snap)}
@media(any-hover:hover){ .wh-empty a:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px var(--lava)} }
.wh-empty a:active{transform:scale(.97);transition-duration:80ms}
</style>
</head>
<body>
<div class="canvas" aria-hidden="true"></div>
<div class="grain" aria-hidden="true"></div>
<span class="preview-tag">Preview · nije uživo</span>

<main class="shell">
  <header class="top">
    <img class="logo" src="assets/logo.png" alt="ASC — Auto servisni centar">
    <nav class="pill" aria-label="Glavna navigacija">
      <span class="pill-links"><a href="dashboard.html">Ploča</a><a href="checkin.html">Zaprimi</a><a class="on" href="warehouse.html">Skladište</a><a href="customers.html">Kupci</a></span>
      <button class="mode" id="mode" aria-label="Promijeni temu"><i></i></button>
    </nav>
  </header>

  <!-- OCCUPANCY OVERVIEW — doubles as the hero -->
  <section class="card dark wh-head reveal" style="animation-delay:110ms">
    <span class="tab-corner">danas · Dubrovnik</span>
    <span class="eyebrow">Hotel za gume · Dubrovnik</span>
    <div class="wh-title">
      <h1>Skladište</h1>
      <span class="sub"><span data-count="0">0</span> kompleta na karti</span>
    </div>
    <div class="wh-stats">
      <div class="wh-stat"><b id="stStored" data-count="0">0</b><span>Spremljeno</span></div>
      <div class="wh-stat res"><b id="stReserved" data-count="0">0</b><span>Rezervirano</span></div>
      <div class="wh-stat"><b id="stZones" data-count="0">0</b><span>Zone</span></div>
    </div>
    <div class="wh-meter" aria-hidden="true"><i id="stMeter" data-w="0"></i></div>
    <div class="wh-cap" id="stCap">Popunjenost skladišta</div>
    <div class="wh-legend" aria-hidden="true">
      <span class="leg f"><i></i>Zauzeto</span>
      <span class="leg r"><i></i>Rezervirano</span>
      <span class="leg e"><i></i>Slobodno</span>
    </div>
  </section>

  <!-- Photographed floors, under Skladište. Live map still fills #map when stock exists. -->
  <div class="wh-zonebar" id="floorTabs" role="group" aria-label="Prostori"></div>
  <div id="floorStage" class="card reveal"></div>
  <style>
    #floorStage{position:relative;margin-top:12px;border-radius:22px;overflow:hidden;height:min(72vh,760px);background:#1c1e24;perspective:1200px}
    #floorStage .world{position:absolute;inset:0;transform-origin:0 0;transition:transform 900ms cubic-bezier(.22,.8,.24,1)}
    #floorStage img{width:100%;height:100%;object-fit:cover;display:block}
    #floorStage .tire{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border:0;border-radius:50%;cursor:pointer;
      background:radial-gradient(circle at 32% 28%,var(--lava-2,#ff8a5c),var(--lava,#ff4e1b) 64%,#d6390c);color:#fff;
      font:700 10px Inter,sans-serif;box-shadow:0 8px 16px rgba(255,78,27,.35);transform:scale(.6);opacity:0;
      animation:tireIn 420ms cubic-bezier(.22,.8,.24,1) forwards}
    #floorStage .tire.on{outline:2px solid #fff;outline-offset:3px;z-index:2}
    #floorHud{position:absolute;left:14px;right:14px;bottom:14px;display:flex;justify-content:space-between;gap:12px;align-items:end;pointer-events:none}
    #floorHud .cardish{pointer-events:auto;background:rgba(255,255,255,.94);color:#1c1e24;border-radius:16px;padding:12px 14px;min-width:180px;
      box-shadow:0 16px 36px rgba(0,0,0,.22);transform:translateY(8px);opacity:0;transition:opacity 240ms,transform 240ms}
    #floorHud .cardish.show{opacity:1;transform:none}
    #floorHud b{display:block;font:700 16px Sora,sans-serif}
    #floorHud span{display:block;margin-top:3px;color:#666;font:600 12.5px Inter,sans-serif}
    #flyBack{pointer-events:auto;border:0;border-radius:999px;padding:10px 14px;background:var(--lava,#ff4e1b);color:#fff;font:650 13px Inter,sans-serif;cursor:pointer;
      opacity:0;transform:translateY(8px);transition:opacity 240ms,transform 240ms}
    #flyBack.show{opacity:1;transform:none}
    @keyframes tireIn{to{opacity:1;transform:scale(1)}}
    @media(prefers-reduced-motion:reduce){#floorStage .world{transition:none}#floorStage .tire{animation:none;opacity:1;transform:none}}
  </style>
  <script>
    (function(){
      var rooms=[
        {id:'hall',name:'Dvorana',img:'assets/floors/hall.jpg',stacks:[
          {x:22,y:8,n:'A1',name:'Ivana Kovač',plate:'DU 214-AB'},{x:32,y:8,n:'A2',name:'Marko Burić',plate:'DU 880-CK'},{x:42,y:8,n:'A3',name:'Petra Jurjević',plate:'DU 441-LM'},{x:52,y:8,n:'A4',name:'Ante Vuković',plate:'DU 773-TR'},{x:63,y:10,n:'A5',name:'Luka Perić',plate:'DU 556-ND'},
          {x:22,y:16,n:'A6'},{x:32,y:16,n:'A7'},{x:42,y:16,n:'A8'},{x:52,y:16,n:'A9'},{x:62,y:18,n:'A10'},
          {x:28,y:62,n:'B1',name:'Hotel Excelsior',plate:'DU 019-HX'},{x:40,y:62,n:'B2'},{x:52,y:62,n:'B3'},
          {x:28,y:78,n:'B4'},{x:40,y:78,n:'B5'},{x:52,y:78,n:'B6'}
        ]},
        {id:'square',name:'Kvadrat',img:'assets/floors/square.jpg',stacks:[
          {x:18,y:22,n:'L1'},{x:22,y:36,n:'L2'},{x:20,y:58,n:'L3'},{x:28,y:82,n:'L4'},
          {x:38,y:12,n:'T1'},{x:52,y:12,n:'T2'},{x:66,y:14,n:'T3'},
          {x:78,y:28,n:'R1'},{x:80,y:48,n:'R2'},{x:74,y:72,n:'R3'}
        ]},
        {id:'triangle',name:'Trokut',img:'assets/floors/triangle.jpg',stacks:[
          {x:18,y:78,n:'C1'},{x:22,y:62,n:'C2'},{x:28,y:48,n:'C3'},{x:34,y:36,n:'C4'},{x:40,y:28,n:'C5'},
          {x:48,y:70,n:'S1'},{x:52,y:52,n:'S2'},{x:56,y:38,n:'S3'},
          {x:70,y:22,n:'D1'},{x:74,y:36,n:'D2'},{x:72,y:52,n:'D3'},{x:78,y:68,n:'D4'}
        ]},
        {id:'ell',name:'Kut',img:'assets/floors/ell.jpg',stacks:[
          {x:18,y:42,n:'K1'},{x:26,y:42,n:'K2'},{x:34,y:42,n:'K3'},
          {x:18,y:54,n:'K4'},{x:26,y:54,n:'K5'},{x:34,y:54,n:'K6'},
          {x:18,y:66,n:'K7'},{x:26,y:66,n:'K8'},{x:34,y:66,n:'K9'},
          {x:18,y:80,n:'K10'},{x:26,y:80,n:'K11'},{x:34,y:80,n:'K12'},
          {x:50,y:42,n:'M1'},{x:60,y:42,n:'M2'},{x:70,y:42,n:'M3'},{x:80,y:42,n:'M4'},
          {x:50,y:54,n:'M5'},{x:60,y:54,n:'M6'},{x:70,y:54,n:'M7'},{x:80,y:54,n:'M8'},
          {x:50,y:66,n:'M9'},{x:60,y:66,n:'M10'},{x:70,y:66,n:'M11'},{x:80,y:66,n:'M12'},
          {x:50,y:80,n:'M13'},{x:60,y:80,n:'M14'},{x:70,y:80,n:'M15'},{x:80,y:80,n:'M16'}
        ]}
      ];
      var tabs=document.getElementById('floorTabs'), stage=document.getElementById('floorStage');
      stage.innerHTML='<div class="world" id="floorWorld"></div><div id="floorHud"><div class="cardish" id="floorCard"></div><button id="flyBack" type="button">Natrag na prostor</button></div>';
      var world=document.getElementById('floorWorld'), card=document.getElementById('floorCard'), back=document.getElementById('flyBack');
      function show(room){
        tabs.querySelectorAll('button').forEach(function(b){b.classList.toggle('on', b.dataset.id===room.id);});
        world.style.transition='none';
        world.style.transform='scale(1.08) translate(0,0)';
        world.innerHTML='<img src="'+room.img+'" alt="'+room.name+'">'+room.stacks.map(function(s,i){
          return '<button class="tire" style="left:'+s.x+'%;top:'+s.y+'%;animation-delay:'+(40+i*22)+'ms" data-x="'+s.x+'" data-y="'+s.y+'" data-n="'+s.n+'" data-name="'+(s.name||'Slobodno')+'" data-plate="'+(s.plate||'')+'">'+s.n+'</button>';
        }).join('');
        card.classList.remove('show'); back.classList.remove('show');
        requestAnimationFrame(function(){world.style.transition=''; world.style.transform='scale(1) translate(0,0)';});
      }
      function flyTo(s){
        var x=parseFloat(s.dataset.x), y=parseFloat(s.dataset.y), z=2.6;
        world.style.transform='scale('+z+') translate('+((50-x)/z)+'%,'+((42-y)/z)+'%)';
        stage.querySelectorAll('.tire.on').forEach(function(el){el.classList.remove('on');});
        s.classList.add('on');
        card.innerHTML='<b>'+s.dataset.name+'</b><span>'+s.dataset.n+(s.dataset.plate?' · '+s.dataset.plate:' · slobodno')+'</span>';
        card.classList.add('show'); back.classList.add('show');
      }
      function flyOut(){
        world.style.transform='scale(1) translate(0,0)';
        stage.querySelectorAll('.tire.on').forEach(function(el){el.classList.remove('on');});
        card.classList.remove('show'); back.classList.remove('show');
      }
      tabs.innerHTML='<div class="wh-zonebar">'+rooms.map(function(r){return '<button class="chip wh-zonepill" data-id="'+r.id+'">'+r.name+'</button>';}).join('')+'</div>';
      tabs.addEventListener('click', function(e){var b=e.target.closest('button'); if(!b) return; show(rooms.filter(function(r){return r.id===b.dataset.id;})[0]);});
      stage.addEventListener('click', function(e){var s=e.target.closest('.tire'); if(!s) return; flyTo(s);});
      back.addEventListener('click', flyOut);
      show(rooms[0]);
    })();
  </script>
  <div id="zonebar"></div>
  <div id="map"></div>
</main>


<script src="app.js"></script>
<!-- LIVE: build the zone map, pills and occupancy numbers from real Supabase data. -->
<script type="module" src="live-warehouse.js"></script>
</body>
</html>
