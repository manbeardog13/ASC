<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-visual">
<title>ASC — Prijava</title>
<meta name="theme-color" content="#f1eee7">
<script src="theme-boot.js"></script>
<script src="asc-brand.js"></script>
<link rel="preload" href="assets/logo.png" as="image" fetchpriority="high">
<link rel="icon" href="assets/favicon-32.png" sizes="32x32">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="asc-brand.css">
<style>
* { box-sizing: border-box; }
html {
  --paper: #f1eee7;
  --card: #fcfbf7;
  --drawing: #e2e4d9;
  --ink: #1d3439;
  --muted: #52656a;
  --rule: #b8c2bd;
  --petrol: #23545b;
  --accent: #772b38;
  --field: #fffefa;
  --action-text: #fff;
  color-scheme: light;
  background: var(--paper);
  scroll-padding-block: 16px;
}
html.dark {
  --paper: #263a40;
  --card: #31474c;
  --drawing: #9faea9;
  --ink: #f6f3e9;
  --muted: #d0dcd7;
  --rule: #81938e;
  --petrol: #b5dbd3;
  --accent: #ffb8bb;
  --field: #293e44;
  --action-text: #183b3c;
  color-scheme: dark;
}
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: max(28px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
    max(20px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
  font: 400 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  color: var(--ink);
  background: var(--paper);
}
/* Keep the page naturally scrollable when the keyboard overlays the layout viewport. */
body::after { content: ""; flex: 0 0 var(--keyboard-space, 0px); }
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--petrol); outline-offset: 3px; }
main {
  width: min(1032px, 100%);
  margin-block: auto;
  display: grid;
  grid-template-columns: minmax(0, 1.06fr) minmax(0, 1fr);
  border-radius: 28px;
  background: var(--card);
  border: 1px solid color-mix(in srgb, var(--ink) 12%, transparent);
  box-shadow: 0 18px 64px -44px rgba(32,50,51,.42);
}
.auth-visual {
  position: relative;
  isolation: isolate;
  min-width: 0;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  border-radius: 27px 0 0 27px;
  padding: clamp(28px, 4vw, 52px);
  color: #293f40;
  background: linear-gradient(139deg, #f0efe6, var(--drawing) 54%, #a0b7ae);
}
.auth-brand { z-index: 1; align-self: flex-start; width: 152px; max-width: 100%; }
.auth-brand .asc-brand-frame { width: 100%; }
.auth-logo { display: block; width: 100%; height: auto; }
.auth-location {
  display: flex; align-items: center; gap: 10px; margin: 0;
  font-size: 11px; font-weight: 650; letter-spacing: .18em; text-transform: uppercase;
}
.auth-location::before { content: ""; width: 26px; height: 2px; background: #772b38; }
.auth-visual::before {
  content: ""; position: absolute; z-index: -1;
  width: 112%; aspect-ratio: 1; left: 12%; top: 51%; transform: translateY(-50%);
  border-radius: 50%; border: 1px solid rgba(30,61,58,.22);
  box-shadow: 0 0 0 18px #ffffff20, 0 0 0 19px #335e5d1a;
}
@media (min-width: 751px) {
  .auth-visual::after {
    content: ""; position: absolute; inset: 12% -20% 11% 6%; z-index: -1;
    background: url('assets/tire-1.png') center / contain no-repeat;
    transform: rotate(-12deg);
  }
}
.auth-card { min-width: 0; width: 100%; padding: clamp(26px, 4vw, 54px); }
.auth-top { display: flex; justify-content: flex-end; align-items: center; gap: 3px; margin-bottom: 12px; }
.auth-lang, .auth-theme {
  display: inline-grid; place-content: center; width: 44px; height: 44px;
  border: 0; background: transparent; border-radius: 50%; color: var(--muted);
}
.auth-lang { font-size: 11px; font-weight: 700; letter-spacing: .08em; }
.auth-theme i {
  display: block; height: 16px; width: 16px; border: 1.5px solid currentColor;
  border-radius: 50%; background: linear-gradient(90deg, currentColor 50%, transparent 50%);
}
.auth-title { margin: 0; font-size: clamp(30px, 3vw, 43px); font-weight: 620; line-height: 1.07; letter-spacing: -.055em; }
.auth-sub { margin: 9px 0 25px; font-size: 14px; color: var(--muted); line-height: 1.45; }
.auth-names { display: none; }
body.signup .auth-names { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.fieldx { display: block; min-width: 0; margin: 0 0 12px; }
.field-label { display: block; margin: 0 0 5px; font-size: 13px; font-weight: 610; }
.field-shell {
  display: flex; align-items: center; min-width: 0; background: var(--field);
  border: 1px solid var(--rule); border-radius: 11px;
}
.field-shell:focus-within { border-color: var(--petrol); outline: 2px solid var(--petrol); outline-offset: 1px; }
.fieldx input {
  width: 100%; min-width: 0; flex: 1; padding: 11px 13px;
  min-height: 46px; background: transparent; color: var(--ink);
  border: 0; border-radius: 11px; outline: 0; font-size: 16px; line-height: 1.4;
}
.fieldx input::placeholder { color: var(--muted); opacity: .8; }
.fx-eye { flex: 0 0 44px; height: 44px; border: 0; background: transparent; display: grid; place-items: center; color: var(--muted); border-radius: 8px; }
.auth-forgot-row { display: flex; justify-content: flex-end; margin-top: -8px; }
.auth-forgot, .auth-switch button {
  min-height: 44px; border: 0; padding: 0 2px; color: var(--petrol); background: transparent;
  font-size: 13px; font-weight: 630;
}
.auth-switch { text-align: center; margin: 10px 0 0; color: var(--muted); font-size: 13px; }
.btn-amber, .btn-google {
  width: 100%; min-height: 48px; display: flex; align-items: center; justify-content: center;
  gap: 9px; border-radius: 12px; font-size: 15px; font-weight: 620;
}
.btn-amber { background: var(--petrol); color: var(--action-text); border: 1px solid var(--petrol); }
.btn-google { background: var(--card); color: var(--ink); border: 1px solid var(--rule); }
button:disabled { opacity: .6; cursor: progress; }
@media (hover:hover) {
  .btn-amber:hover { filter: brightness(1.1); }
  .btn-google:hover, .auth-theme:hover, .auth-lang:hover { background: color-mix(in srgb, var(--petrol) 8%, var(--card)); }
  .auth-forgot:hover, .auth-switch button:hover { text-decoration: underline; }
}
.auth-div { display: flex; align-items: center; gap: 10px; margin: 16px 0; color: var(--muted); font-size: 12px; }
.auth-div::before, .auth-div::after { content: ""; height: 1px; flex: 1; background: var(--rule); opacity: .55; }
.auth-msg { margin: 12px 0 0; font-size: 14px; color: var(--petrol); overflow-wrap: anywhere; }
.auth-msg:empty { margin: 0; }
.auth-msg.err { color: var(--accent); }
body.signup .auth-forgot-row, body.recover .auth-forgot-row,
body.reset .f-pass, body.reset .btn-google, body.reset .auth-div, body.reset .auth-switch,
body.recover .f-email, body.recover .btn-google, body.recover .auth-div, body.recover .auth-switch { display: none; }
.nero-mark { flex: none; margin: 22px 0 0; color: var(--muted); font-size: 11px; text-align: center; letter-spacing: .028em; }
.nero-mark a { display: inline-block; color: inherit; font-weight: 640; text-underline-offset: .2em; }
@media (max-width: 750px) {
  body {
    padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
      max(14px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  }
  main { max-width: 460px; grid-template-columns: minmax(0,1fr); border-radius: 22px; }
  .auth-visual { flex-direction: row; align-items: center; padding: 21px 23px; border-radius: 21px 21px 0 0; }
  .auth-visual::before { width: 50%; top: -42%; left: 51%; }
  .auth-location { font-size: 10px; letter-spacing: .1em; gap: 6px; }
  .auth-location::before { width: 14px; }
  .auth-brand { width: 100px; }
  .auth-card { padding: 12px clamp(16px, 5vw, 30px) 15px; }
  .auth-top { margin: 0 -6px 5px 0; }
  .auth-sub { margin-bottom: 20px; }
}
@media (orientation: landscape) and (max-height: 520px) {
  body { padding-top: max(10px, env(safe-area-inset-top)); }
  main { max-width: 710px; grid-template-columns: minmax(0,.62fr) minmax(280px,1fr); }
  .auth-visual { flex-direction: column; align-items: flex-start; padding: 22px; border-radius: 21px 0 0 21px; }
  .auth-brand { width: 120px; }
  .auth-card { padding: 8px 20px 14px; }
  .auth-top { margin-bottom: 2px; }
  .auth-sub { margin: 5px 0 15px; }
}
@media (max-width: 360px) {
  .auth-visual { padding-inline: 16px; }
  body.signup .auth-names { grid-template-columns: minmax(0,1fr); gap: 0; }
}
</style>
</head>
<body>
<div id="splash" class="asc-entry" aria-hidden="true" hidden>
  <div class="sp-core">
    <img class="sp-mark" src="assets/logo.png" alt="" width="488" height="92" decoding="async">
  </div>
</div>

<main aria-labelledby="title">
  <aside class="auth-visual" aria-label="ASC Dubrovnik">
    <div class="auth-brand"><img class="auth-logo" src="assets/logo.png" width="488" height="92" alt="ASC — Auto Servis Deranja"></div>
    <p class="auth-location">Dubrovnik</p>
  </aside>
  <section class="auth-card">
    <div class="auth-top">
      <button class="auth-lang" id="lang" type="button"></button>
      <button class="auth-theme" id="theme" type="button" aria-label="Tema"><i></i></button>
    </div>
    <h1 class="auth-title" id="title">Dobrodošli natrag</h1>
    <p class="auth-sub" id="sub">Hotel za gume · Dubrovnik</p>

    <form id="form" method="post" autocomplete="on">
      <div class="auth-names">
        <label class="fieldx"><span class="field-label" id="firstLabel">Ime</span>
          <span class="field-shell"><input id="first" name="given-name" type="text" autocomplete="given-name" enterkeyhint="next"></span></label>
        <label class="fieldx"><span class="field-label" id="lastLabel">Prezime</span>
          <span class="field-shell"><input id="last" name="family-name" type="text" autocomplete="family-name" enterkeyhint="next"></span></label>
      </div>
      <label class="fieldx f-email"><span class="field-label" id="emailLabel">E-pošta</span>
        <span class="field-shell"><input id="email" name="username" type="email" inputmode="email" autocapitalize="none" spellcheck="false" autocomplete="username" enterkeyhint="next" required placeholder="ime@primjer.hr"></span></label>
      <div class="fieldx f-pass">
        <label class="field-label" for="password" id="passwordLabel">Lozinka</label>
        <div class="field-shell">
          <input id="password" name="password" type="password" autocomplete="current-password" enterkeyhint="go" required>
          <button class="fx-eye" id="eye" type="button" aria-label="Prikaži lozinku" aria-pressed="false"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/></svg></button>
        </div>
      </div>
      <div class="auth-forgot-row"><button class="auth-forgot" id="forgot" type="button">Zaboravljena lozinka?</button></div>
      <button class="btn-amber" id="submit" type="submit" disabled>Prijavi se
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      <p class="auth-msg" id="msg" role="status" aria-live="polite">Povezivanje…</p>
    </form>
    <div class="auth-div" id="divider">ili</div>
    <button class="btn-google" id="google" type="button" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.3 9.14 5.38 12 5.38z"/></svg>
      Nastavi s Google
    </button>

    <p class="auth-switch" id="switchRow">Prvi put? <button id="switch" type="button">Napravi račun</button></p>
  </section>
</main>

<script>
(function () {
  if (window.ASCBrand) window.ASCBrand.enhance(document);
  // Supabase may consume the callback fragment as its module initializes.
  const callback = new URLSearchParams(location.hash.slice(1));
  if (['recovery', 'invite'].includes(callback.get('type')) && !callback.has('error')) {
    document.body.dataset.setPassword = 'true';
  }

  const viewport = window.visualViewport;
  const form = document.getElementById('form');
  // Always keep credentials inside the authenticated SDK, including a slow or failed import.
  form.addEventListener('submit', event => event.preventDefault());
  let frame = 0;
  function fitField() {
    frame = 0;
    const input = document.activeElement;
    const editing = input instanceof HTMLInputElement && form.contains(input);
    const height = viewport ? viewport.height : window.innerHeight;
    const top = viewport ? viewport.offsetTop : 0;
    const zoomed = viewport && viewport.scale > 1.05;
    // Safari can cover layout pixels without changing innerHeight or CSS vh.
    const covered = editing && !zoomed ? Math.max(0, document.documentElement.clientHeight - height) : 0;
    document.body.style.setProperty('--keyboard-space', Math.ceil(covered) + 'px');
    if (!editing || zoomed) return;
    const rect = input.closest('.fieldx').getBoundingClientRect();
    const upper = top + 12;
    const lower = top + height - 20;
    const delta = rect.bottom > lower ? rect.bottom - lower : Math.min(0, rect.top - upper);
    if (Math.abs(delta) > 1) window.scrollBy(0, delta);
  }
  function schedule() {
    if (!frame) frame = requestAnimationFrame(fitField);
  }
  form.addEventListener('focusin', schedule);
  form.addEventListener('focusout', schedule);
  window.addEventListener('resize', schedule);
  if (viewport) viewport.addEventListener('resize', schedule);
})();
</script>
<script type="module" id="auth-module">
  import { supabase, isConfigured } from '../js/supabaseClient.js';
  import { getSession, signIn, signUp, sendPasswordReset, updatePassword } from '../js/db.js';
  import { safeLoginReturn } from '../js/firstRun.js';
  import { t, lang, setLang } from '../js/i18n.js';

  const $ = (id) => document.getElementById(id);
  const form = $('form'), msg = $('msg'), submit = $('submit'), title = $('title'), sub = $('sub'), switchBtn = $('switch');
  let mode = 'signin';   // signin | signup | reset | recover

  const say = (text, kind) => { msg.textContent = text || ''; msg.className = 'auth-msg' + (kind ? ' ' + kind : ''); };
  const busy = (on) => { submit.disabled = on; $('google').disabled = on; };
  const REMEMBER = 'asc.rememberEmail';
  // One language at a time: HR default, EN on request; the toggle names the other language.
  const applyStatic = () => {
    document.documentElement.lang = lang();
    $('google').lastChild.textContent = ' ' + t('au.google') + ' ';
    $('divider').textContent = t('au.or'); $('forgot').textContent = t('au.forgot');
    for (const [id, key] of [['first', 'au.firstName'], ['last', 'au.lastName'], ['email', 'au.email']]) {
      $(id + 'Label').textContent = t(key);
    }
    $('theme').setAttribute('aria-label', t('au.theme'));
    $('lang').textContent = lang() === 'hr' ? 'EN' : 'HR'; $('lang').setAttribute('aria-label', t('au.langLabel'));
  };
  $('lang').addEventListener('click', () => { setLang(lang() === 'hr' ? 'en' : 'hr'); applyStatic(); setMode(mode); });
  applyStatic(); setMode(mode);

  // Theme toggle (login-scoped, persisted; the app reads asc.theme too).
  $('theme').addEventListener('click', () => {
    if (window.ASCTheme) window.ASCTheme.toggle();
    else {
      const dark = document.documentElement.classList.toggle('dark');
      document.querySelector('meta[name="theme-color"]').content = dark ? '#0a0c11' : '#f1eee7';
      try { localStorage.setItem('asc.theme', dark ? 'dark' : 'light'); } catch (e) {}
    }
  });
  // Show / hide password
  $('eye').addEventListener('click', () => {
    const p = $('password');
    p.type = p.type === 'password' ? 'text' : 'password';
    $('eye').setAttribute('aria-pressed', String(p.type === 'text'));
    $('eye').setAttribute('aria-label', t(p.type === 'password' ? 'login.showPw' : 'login.hidePw'));
  });

  busy(!isConfigured());
  if (!isConfigured()) say(t('au.noConfig'), 'err');

  // Prefill the last email used.
  try { const s = localStorage.getItem(REMEMBER); if (s) $('email').value = s; } catch (e) {}

  // Entry — the Prag splash (window.ASCSplash, armed pre-paint in <head>) covers
  // this whole decision; the card is only revealed (S.done → lift) when the user
  // actually needs it. Recovery / invite links land with type=recovery in the hash.
  const S = window.ASCSplash;
  // Where to land after sign-in: the page that sent us here (same app only), else the board.
  const entry = new URLSearchParams(location.search);
  let studioReturn = '';
  if (entry.get('from') === 'studio') {
    const preserved = new URLSearchParams();
    const room = entry.get('room');
    if (room && /^[a-z][a-z0-9-]{0,62}$/.test(room)) preserved.set('room', room);
    if (['plan', 'walk', '3d'].includes(entry.get('view'))) preserved.set('view', entry.get('view'));
    if (['obilazak', 'regal'].includes(entry.get('vodic'))) preserved.set('vodic', entry.get('vodic'));
    if (/^[1-6]$/.test(entry.get('guide') || '')) preserved.set('guide', entry.get('guide'));
    if (/^[a-zA-Z0-9_-]{1,80}$/.test(entry.get('find') || '')) preserved.set('find', entry.get('find'));
    studioReturn = 'spatial-studio/index.html' + (preserved.size ? '?' + preserved : '');
    try { sessionStorage.setItem('asc.return', studioReturn); } catch (_) {}
  }
  const dest = () => {
    let r = null; try { r = sessionStorage.getItem('asc.return'); sessionStorage.removeItem('asc.return'); } catch (e) {}
    return safeLoginReturn(r) || studioReturn || 'dashboard.html';
  };
  const hash = new URLSearchParams(location.hash.slice(1));
  if (document.body.dataset.setPassword === 'true' && !hash.has('error')) { setMode('recover'); S.done(); }
  else if (hash.get('error')) {
    // OAuth bounced back with an error — surface it on the card, clean the hash.
    // (URLSearchParams already percent-decoded the value; decoding again throws
    // URIError on a literal '%' and would kill the whole module.)
    say((hash.get('error_description') || t('au.googleFail')).replace(/\+/g, ' '), 'err');
    history.replaceState(null, '', location.pathname);
    S.done();
  } else if (S.mode === 'oauth') {
    // Returning from Google with tokens: NEVER navigate on a bare getSession() —
    // it can resolve null before the hash is exchanged and the dashboard gate
    // would bounce us back (visible loop). Race the auth event, cap at 4s.
    Promise.race([
      new Promise((res) => {
        const { data } = supabase.auth.onAuthStateChange((_e, s) => { if (s) { data.subscription.unsubscribe(); res(s); } });
        getSession().then((s) => { if (s) res(s); }).catch(() => {});
      }),
      new Promise((res) => setTimeout(res, 4000, null)),
    ]).then((s) => { if (s) S.handoff(dest()); else S.done(); });
  } else {
    getSession().then((s) => { s ? S.handoff(dest()) : S.done(); }).catch(() => S.done());
  }

  function setMode(next) {
    mode = next;
    document.body.className = next === 'signin' ? '' : next;
    const map = {
      signin:  { t: t('au.welcome'), s: t('au.place'),  btn: t('au.signin'),   pass: t('au.pass') },
      signup:  { t: t('au.newT'),    s: t('au.newS'),   btn: t('au.newBtn'),   pass: t('au.pass') },
      reset:   { t: t('au.resetT'),  s: t('au.resetS'), btn: t('au.resetBtn'), pass: t('au.pass') },
      recover: { t: t('au.recT'),    s: t('au.recS'),   btn: t('au.recBtn'),   pass: t('au.newPass') },
    }[next];
    title.textContent = map.t; sub.textContent = map.s;
    submit.firstChild.textContent = map.btn + ' ';
    $('passwordLabel').textContent = map.pass;
    $('password').type = 'password';
    $('eye').setAttribute('aria-pressed', 'false');
    $('forgot').textContent = t(next === 'reset' ? 'au.back' : 'au.forgot');
    $('email').autocomplete = next === 'signin' ? 'username' : 'email';
    $('email').enterKeyHint = next === 'reset' ? 'go' : 'next';
    $('eye').setAttribute('aria-label', t('login.showPw'));
    $('password').autocomplete = next === 'signin' ? 'current-password' : 'new-password';
    $('password').required = next !== 'reset';
    $('email').required = next !== 'recover';
    $('email').disabled = next === 'recover';
    $('password').disabled = next === 'reset';
    $('first').disabled = $('last').disabled = next !== 'signup';
    switchBtn.textContent = next === 'signin' ? t('au.newBtn') : t('au.haveAcc');
    $('switchRow').firstChild.textContent = next === 'signin' ? t('au.first') : ' ';
    say('');
  }

  switchBtn.addEventListener('click', () => {
    setMode(mode === 'signup' ? 'signin' : 'signup');
    $(mode === 'signup' ? 'first' : 'email').focus();
  });
  $('forgot').addEventListener('click', () => {
    setMode(mode === 'reset' ? 'signin' : 'reset');
    $('email').focus();
  });

  // Continue with Google — return to THIS staging app (not the mock root).
  // bloom() BEFORE signInWithOAuth: the library assigns location itself, so the
  // exit to accounts.google.com happens under the settled brand surface instead
  // of a half-disabled card + browser white flash. No handoff flag on the way
  // out — the return leg is detected by the token hash.
  $('google').addEventListener('click', async () => {
    say(''); busy(true);
    S.bloom();
    const redirectTo = location.href.split('#')[0].split('?')[0];
    try {
      const { error } = await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo } });
      if (error) throw error;
    } catch (error) {
      S.abort();
      say(t(/not enabled|unsupported provider/i.test(error?.message || '') ? 'au.googleOff' : 'au.googleFail'), 'err');
      busy(false);
    }
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = $('email').value.trim(), password = $('password').value;
    const name = [$('first').value.trim(), $('last').value.trim()].filter(Boolean).join(' ');
    busy(true);
    try {
      if (mode === 'signin') {
        await signIn(email, password);
        try { localStorage.setItem(REMEMBER, email); } catch (e2) {}
        S.bloom(() => S.handoff(dest()));    // cover, then swap under the opaque surface
      } else if (mode === 'signup') {
        const { needsConfirm } = await signUp(email, password, name);
        if (needsConfirm) { setMode('signin'); say(t('au.created'), 'ok'); }
        else S.bloom(() => S.handoff(dest()));
      } else if (mode === 'reset') {
        await sendPasswordReset(email);
        setMode('signin'); say(t('au.resetSent', { email }), 'ok');
      } else if (mode === 'recover') {
        await updatePassword(password);
        say(t('au.saved'), 'ok');
        setTimeout(() => S.bloom(() => S.handoff(dest())), 700);
      }
    } catch (err) {
      say(err.message || t('au.oops'), 'err');
    } finally { busy(false); }
  });
</script>
<script>
document.getElementById('auth-module').addEventListener('error', () => {
  const message = document.getElementById('msg');
  message.className = 'auth-msg err';
  message.textContent = 'Prijava se nije učitala. Provjerite vezu i osvježite stranicu.';
});
</script>
