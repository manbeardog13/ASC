<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ASC — Prijava</title>
<meta name="theme-color" content="#020305">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<noscript><meta http-equiv="refresh" content="0;url=https://app.nerosummit.com"></noscript>
<style>
  html,body{height:100%;margin:0}
  body{background:#020305;color:#f4f5f7;font-family:"Inter",system-ui,-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  .b{max-width:340px;padding:24px}
  .m{font-weight:800;font-size:26px;letter-spacing:2px;color:#ff4e1b;margin-bottom:14px}
  p{color:#9aa0ac;font-size:14px;line-height:1.5;margin:0 0 20px}
  a.continue{display:inline-block;min-height:46px;line-height:46px;padding:0 22px;border-radius:999px;
    background:#ff4e1b;color:#fff;font-weight:700;font-size:15px;text-decoration:none}
  .nero-mark{position:static;left:auto;right:auto;bottom:auto;margin:16px 0 0;padding:0 16px 12px;text-align:center;
    font:600 10px/1 Inter,system-ui,sans-serif;letter-spacing:.22em;text-transform:lowercase;
    color:rgba(244,245,247,.34);text-shadow:0 -1px 0 #000,0 1px 0 rgba(255,255,255,.08);pointer-events:none}
  .nero-mark a{display:inline;min-height:0;line-height:1;padding:0;border-radius:0;background:none;
    color:inherit;font:inherit;letter-spacing:inherit;font-weight:600;text-decoration:none;pointer-events:auto}
</style>
</head>
<body>
  <div class="b">
    <div class="m">ASC</div>
    <p>Prijava je na Nero Summitu.</p>
    <a class="continue" href="https://app.nerosummit.com">Nastavi na Nero Summit</a>
  </div>
<script type="module">
  import { getSession } from '../js/db.js';
  import { continueAfterSession, loginDestination, openLoginStorage } from '../js/neroLogin.js';
  // An existing ASC session still enters the app (and a safe asc.return path).
  // No session: Nero Summit. The credential form is gone.
  // Read storage before the session promise so a blocked sessionStorage cannot
  // fall into the rejection path and send a signed-in user to Nero.
  const storage = openLoginStorage(() => sessionStorage);
  getSession()
    .then((session) => location.replace(continueAfterSession(session, storage)))
    .catch(() => location.replace(loginDestination({ session: null })));
</script>
<p class="nero-mark">Powered by <a href="https://nerosummit.com">Nero Summit</a></p>
</body>
</html>
